<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRDashboard – Live Range</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('srdashboard-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
        var sat = localStorage.getItem('srdashboard-shot-sat');
        if (sat != null && sat !== '') {
          var n = Math.round(Number(sat));
          if (isFinite(n)) {
            if (n < 0) n = 0;
            if (n > 100) n = 100;
            document.documentElement.style.setProperty('--shot-sat', String(n));
          }
        }
        var mode = localStorage.getItem('srdashboard-shot-mode');
        if (mode != null && mode !== '') {
          if (mode === 'rainbow') {
            document.documentElement.style.setProperty('--shot-mode', 'rainbow');
          } else {
            var mi = Math.round(Number(mode));
            if (isFinite(mi) && mi >= 0 && mi <= 9) {
              document.documentElement.style.setProperty('--shot-mode', String(mi));
            }
          }
        }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/style.css?v=justitia">
</head>
<body>
  <div id="shooter-app" hidden></div>
  <div id="config-app" hidden></div>
  <div id="master-chrome">
    <header class="side-rail" id="top-bar">
      <div class="side-rail-slim">
        <button type="button" class="menu-toggle btn btn-ghost" id="menu-toggle" aria-expanded="false" aria-controls="top-bar-menu" title="Menü">
          <span class="menu-toggle-icon" aria-hidden="true"></span>
          <span class="menu-toggle-label">Menü</span>
        </button>
        <button type="button" class="rulebook-btn" id="rulebook-btn" hidden title="Regelbuch" aria-label="Regelbuch">
          <span class="rulebook-btn-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" focusable="false">
              <circle cx="8" cy="1.55" r="0.85"/>
              <path d="M8 2.2v10.4"/>
              <path d="M2.1 4.85h11.8"/>
              <path d="M2.1 4.85L.6 9.35h3z"/>
              <path d="M13.9 4.85l1.5 4.5h-3z"/>
              <path d="M5.1 12.6h5.8M3.4 14.2h9.2"/>
            </svg>
          </span>
          <span class="rulebook-btn-label">Regeln</span>
        </button>
        <div id="match-status-compact" class="match-status-compact" aria-live="polite">
          <span class="status-idle">Live</span>
        </div>
      </div>
      <div class="side-rail-menu" id="top-bar-menu" hidden>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <span class="brand-name">SRDashboard</span>
            <span class="brand-sub">Live Range</span>
          </div>
        </div>
        <div id="match-status-strip" class="match-status-strip" aria-live="polite">
          <span class="status-idle">Plugin…</span>
        </div>
        <div id="control-strip" class="control-strip"></div>
      </div>
    </header>
    <div class="master-main">
      <main class="stage lcars-content" id="stage">
        <div id="ranges-grid"></div>
      </main>
    </div>
  </div>
  <script src="/auth.js"></script>
  <script src="/target-core.js?v=crc-header-switch"></script>
  <script src="/plugin-shell.js?v=view-dedupe"></script>
  <script src="/rulebook.js?v=rulebook"></script>
  <script src="/config-editor.js?v=recovery-games"></script>
  <script src="/app.js"></script>
  <script>
    (function () {
      const display = (window.SRDisplay && window.SRDisplay.display) || 'master';
      const boot = (window.SRMode && window.SRMode.ready) || Promise.resolve();
      boot.finally(function () {
        const s = document.createElement('script');
        if (display === 'shooter') s.src = '/shooter.js';
        else if (display === 'config') s.src = '/config-page.js';
        else s.src = '/master.js?v=crc-header-switch';
        document.body.appendChild(s);
      });
    })();
  </script>
</body>
</html>
