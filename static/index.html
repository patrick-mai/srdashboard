<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SRDashboard – Live Range</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem('srdashboard-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/style.css?v=series-focus">
</head>
<body>
  <div id="shooter-app" hidden></div>
  <div id="config-app" hidden></div>
  <div id="master-chrome">
    <header class="side-rail" id="top-bar">
      <div class="side-rail-slim">
        <button type="button" class="menu-toggle btn btn-ghost" id="menu-toggle" aria-expanded="false" aria-controls="top-bar-menu" title="Menü">
          <span class="menu-toggle-icon" aria-hidden="true"></span>
          <span class="menu-toggle-label">Menü</span>
        </button>
        <div id="match-status-compact" class="match-status-compact" aria-live="polite">
          <span class="status-idle">Live</span>
        </div>
      </div>
      <div class="side-rail-menu" id="top-bar-menu" hidden>
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <div class="brand-text">
            <span class="brand-name">SRDashboard</span>
            <span class="brand-sub">Live Range</span>
          </div>
        </div>
        <div id="match-status-strip" class="match-status-strip" aria-live="polite">
          <span class="status-idle">Plugin…</span>
        </div>
        <div id="control-strip" class="control-strip"></div>
      </div>
    </header>
    <div class="master-main">
      <main class="stage lcars-content" id="stage">
        <div id="ranges-grid"></div>
      </main>
    </div>
  </div>
  <script src="/auth.js"></script>
  <script src="/target-core.js?v=series-chart"></script>
  <script src="/plugin-shell.js"></script>
  <script src="/config-editor.js"></script>
  <script src="/app.js"></script>
  <script>
    (function () {
      const display = (window.SRDisplay && window.SRDisplay.display) || 'master';
      const s = document.createElement('script');
      if (display === 'shooter') s.src = '/shooter.js';
      else if (display === 'config') s.src = '/config-page.js';
      else s.src = '/master.js';
      document.body.appendChild(s);
    })();
  </script>
</body>
</html>
