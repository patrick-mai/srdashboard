<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    Same drawing approach as the rifle face: artwork in local units where one
    ring band = 10, then scale into the 200 mm DISAG frame.
    ISSF pistol ring width 8.0 mm → scale = 0.8 about centre (100,100).
    stroke-width 0.5 / font-size 7 match the rifle artwork so zoomed rings
    and numbers keep comparable weight (not hairline mm strokes).
  -->
  <desc>ISSF 10m air pistol (155.5 mm) — scaled face with ring numbers</desc>
  <g transform="translate(100,100) scale(0.8) translate(-100,-100)">
    <g stroke-width="0.5" shape-rendering="geometricPrecision">
      <g fill="white" stroke="black">
        <circle r="97.1875" cx="100" cy="100"/>
        <circle r="87.1875" cx="100" cy="100"/>
        <circle r="77.1875" cx="100" cy="100"/>
        <circle r="67.1875" cx="100" cy="100"/>
        <circle r="57.1875" cx="100" cy="100"/>
        <circle r="47.1875" cx="100" cy="100"/>
      </g>
      <g fill="black" stroke="white">
        <circle r="37.1875" cx="100" cy="100"/>
        <circle r="27.1875" cx="100" cy="100"/>
        <circle r="17.1875" cx="100" cy="100"/>
        <circle r="7.1875" cx="100" cy="100"/>
      </g>
      <circle r="3.125" cx="100" cy="100" fill="white" stroke="white"/>
    </g>
    <g font-size="7" font-family="arial" text-anchor="middle" dominant-baseline="central">
      <g fill="black">
        <text x="100" y="7.8125">1</text>
        <text x="100" y="17.8125">2</text>
        <text x="100" y="27.8125">3</text>
        <text x="100" y="37.8125">4</text>
        <text x="100" y="47.8125">5</text>
        <text x="100" y="57.8125">6</text>
        <text x="100" y="192.1875">1</text>
        <text x="100" y="182.1875">2</text>
        <text x="100" y="172.1875">3</text>
        <text x="100" y="162.1875">4</text>
        <text x="100" y="152.1875">5</text>
        <text x="100" y="142.1875">6</text>
        <text x="7.8125" y="100">1</text>
        <text x="17.8125" y="100">2</text>
        <text x="27.8125" y="100">3</text>
        <text x="37.8125" y="100">4</text>
        <text x="47.8125" y="100">5</text>
        <text x="57.8125" y="100">6</text>
        <text x="192.1875" y="100">1</text>
        <text x="182.1875" y="100">2</text>
        <text x="172.1875" y="100">3</text>
        <text x="162.1875" y="100">4</text>
        <text x="152.1875" y="100">5</text>
        <text x="142.1875" y="100">6</text>
      </g>
      <g fill="white">
        <text x="100" y="67.8125">7</text>
        <text x="100" y="77.8125">8</text>
        <text x="100" y="132.1875">7</text>
        <text x="100" y="122.1875">8</text>
        <text x="67.8125" y="100">7</text>
        <text x="77.8125" y="100">8</text>
        <text x="132.1875" y="100">7</text>
        <text x="122.1875" y="100">8</text>
      </g>
    </g>
  </g>
</svg>
