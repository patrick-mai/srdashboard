<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 664" class="fox-revier-svg">
  <desc>Revier map from Style C Lichtung preview art</desc>
  <defs>
    <g id="fox-sprite">
      <path d="M-10 6 C-18 2 -20 -6 -12 -10 L-6 -18 L0 -10 L8 -12 L16 -6 C22 -2 22 6 16 10 L10 12 L14 16 L6 14 L-2 14 L-10 10 Z"
            fill="#e85d04" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M-6 -18 L-2 -11 L-8 -10 Z" fill="#c2410c"/>
      <path d="M0 -10 L4 -17 L8 -11 Z" fill="#c2410c"/>
      <circle cx="14" cy="-2" r="1.3" fill="#24352b"/>
      <ellipse cx="4" cy="6" rx="4" ry="3" fill="#fff7ed" opacity="0.85"/>
    </g>
  </defs>

  <image href="/plugins/fox-on-the-run/assets/revier-map.png?v=6" x="0" y="0" width="1000" height="664"
         preserveAspectRatio="xMidYMid meet"/>

  <!-- Gameplay Fhrte along preview dirt path (Meute bottom-left ? Bau top-right) -->
  <path id="fahrte" d="M 80 560
    C 140 500, 175 460, 230 440
    S 310 420, 370 400
    S 450 370, 510 340
    S 580 295, 640 250
    S 720 195, 800 150
    S 870 110, 930 90"
