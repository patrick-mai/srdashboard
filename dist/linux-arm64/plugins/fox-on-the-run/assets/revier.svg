        fill="#264653" stroke="rgba(255,255,255,0.85)" stroke-width="4" paint-order="stroke">Meute</text>

  <g transform="translate(930,90)">
    <circle r="15" fill="#e85d04" stroke="#fff" stroke-width="2.5"/>
    <circle r="5.5" fill="#fff7ed"/>
  </g>
  <text x="930" y="128" text-anchor="middle"
        font-family="Segoe UI, system-ui, -apple-system, Roboto, Noto Sans, sans-serif" font-size="18" font-weight="700"
        fill="#e85d04" stroke="rgba(255,255,255,0.85)" stroke-width="4" paint-order="stroke">Bau</text>

  <g id="tokens"></g>
