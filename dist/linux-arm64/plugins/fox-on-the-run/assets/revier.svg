  <g transform="translate(80,560)">
    <circle r="15" fill="#264653" stroke="#fff" stroke-width="2.5"/>
    <circle r="5.5" fill="#f7f4ee"/>
  </g>
  <text x="80" y="598" text-anchor="middle"
