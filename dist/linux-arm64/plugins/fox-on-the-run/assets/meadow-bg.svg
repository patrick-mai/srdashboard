<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a3326"/>
      <stop offset="40%" stop-color="#3a4332"/>
      <stop offset="75%" stop-color="#4a5337"/>
      <stop offset="100%" stop-color="#555a46"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4634"/>
      <stop offset="100%" stop-color="#2b3425"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#454a36"/>
      <stop offset="100%" stop-color="#343a28"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a5337"/>
      <stop offset="100%" stop-color="#2f3726"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555939"/>
      <stop offset="100%" stop-color="#2b3425"/>
    </linearGradient>
    <radialGradient id="mistGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#a7a797" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#868978" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#454a36" stop-opacity="0"/>
    </radialGradient>
    <g id="pine">
      <rect x="-2.5" y="22" width="5" height="18" rx="1" fill="#3a2e22"/>
      <path d="M0 -8 L14 14 L-14 14 Z" fill="#2b3425"/>
      <path d="M0 0 L12 20 L-12 20 Z" fill="#343a28"/>
      <path d="M0 8 L11 28 L-11 28 Z" fill="#3d4634"/>
    </g>
    <g id="bush">
      <ellipse cx="0" cy="6" rx="18" ry="10" fill="#343a28"/>
      <ellipse cx="-10" cy="2" rx="10" ry="8" fill="#454a36"/>
      <ellipse cx="10" cy="3" rx="9" ry="7" fill="#2b3425"/>
    </g>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <ellipse cx="960" cy="420" rx="780" ry="320" fill="url(#mistGlow)"/>

  <!-- soft mist bands -->
  <g fill="#979888" opacity="0.14">
    <ellipse cx="320" cy="220" rx="220" ry="48"/>
    <ellipse cx="700" cy="180" rx="180" ry="40"/>
    <ellipse cx="1180" cy="240" rx="240" ry="52"/>
    <ellipse cx="1580" cy="200" rx="200" ry="44"/>
  </g>

  <path fill="url(#hillFar)"
        d="M0 480 C 200 430, 360 460, 540 410 C 760 350, 920 430, 1140 380 C 1360 330, 1520 400, 1720 360 C 1820 340, 1880 370, 1920 355 L1920 1080 L0 1080 Z"/>
  <path fill="url(#hillMid)"
        d="M0 580 C 180 520, 360 570, 540 510 C 760 440, 940 540, 1160 490 C 1380 440, 1540 530, 1740 490 C 1840 470, 1890 500, 1920 485 L1920 1080 L0 1080 Z"/>
  <path fill="url(#hillNear)"
        d="M0 700 C 160 640, 320 690, 500 630 C 720 555, 900 680, 1120 620 C 1340 560, 1520 670, 1720 610 C 1830 575, 1885 625, 1920 600 L1920 1080 L0 1080 Z"/>
  <path fill="url(#ground)"
        d="M0 820 C 200 770, 380 840, 580 790 C 800 730, 980 850, 1200 800 C 1420 750, 1600 840, 1780 800 C 1860 780, 1900 800, 1920 790 L1920 1080 L0 1080 Z"/>

  <!-- pine line on mid ridge -->
  <g opacity="0.92">
    <use href="#pine" transform="translate(150,545) scale(1.15)"/>
    <use href="#pine" transform="translate(205,555) scale(0.9)"/>
    <use href="#pine" transform="translate(500,490) scale(1.3)"/>
    <use href="#pine" transform="translate(560,505) scale(0.95)"/>
    <use href="#pine" transform="translate(960,465) scale(1.4)"/>
    <use href="#pine" transform="translate(1030,480) scale(1.05)"/>
    <use href="#pine" transform="translate(1460,495) scale(1.25)"/>
    <use href="#pine" transform="translate(1525,508) scale(0.95)"/>
    <use href="#pine" transform="translate(1760,515) scale(1.2)"/>
  </g>

  <use href="#bush" transform="translate(110,860) scale(1.4)"/>
  <use href="#bush" transform="translate(210,880) scale(1.1)"/>
  <use href="#bush" transform="translate(900,900) scale(1.25)"/>
  <use href="#bush" transform="translate(1680,850) scale(1.45)"/>
  <use href="#bush" transform="translate(1780,870) scale(1.15)"/>

  <!-- low mist over ground -->
  <g fill="#a7a797" opacity="0.16">
    <ellipse cx="400" cy="920" rx="320" ry="36"/>
    <ellipse cx="980" cy="960" rx="380" ry="40"/>
    <ellipse cx="1500" cy="930" rx="300" ry="34"/>
  </g>
</svg>
