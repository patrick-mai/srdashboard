<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    ISSF 50m Rifle (KK) face in the 200 mm DISAG frame (1 SVG unit = 1 mm).
    Ring diameters (ISSF 6.3.4.2):
      1=154.4  2=138.4  3=122.4  4=106.4  5=90.4
      6=74.4   7=58.4   8=42.4   9=26.4  10=10.4
      Inner ten = 5.0 mm
    Black aiming mark: from part of 3 through 10 (112.4 mm diam) - rings 3-10 filled black.
    Numbers 1-8 only (9/10 unmarked per ISSF).
  -->
  <desc>ISSF 50m smallbore rifle (154.4 mm) - face with ring numbers</desc>
  <g stroke-width="0.25" shape-rendering="geometricPrecision">
    <g fill="white" stroke="black">
      <circle r="77.2" cx="100" cy="100"/>
      <circle r="69.2" cx="100" cy="100"/>
    </g>
    <g fill="black" stroke="white">
      <circle r="61.2" cx="100" cy="100"/>
      <circle r="53.2" cx="100" cy="100"/>
      <circle r="45.2" cx="100" cy="100"/>
      <circle r="37.2" cx="100" cy="100"/>
      <circle r="29.2" cx="100" cy="100"/>
      <circle r="21.2" cx="100" cy="100"/>
      <circle r="13.2" cx="100" cy="100"/>
      <circle r="5.2" cx="100" cy="100"/>
    </g>
    <circle r="2.5" cx="100" cy="100" fill="white" stroke="white"/>
  </g>
  <g font-size="5.5" font-family="arial" text-anchor="middle" dominant-baseline="central">
    <!-- Labels at mid-band of each ring zone (radius midpoints). -->
    <g fill="black">
      <text x="100" y="26.8">1</text>
      <text x="100" y="34.8">2</text>
      <text x="100" y="173.2">1</text>
      <text x="100" y="165.2">2</text>
      <text x="26.8" y="100">1</text>
      <text x="34.8" y="100">2</text>
      <text x="173.2" y="100">1</text>
      <text x="165.2" y="100">2</text>
    </g>
    <g fill="white">
      <text x="100" y="42.8">3</text>
      <text x="100" y="50.8">4</text>
      <text x="100" y="58.8">5</text>
      <text x="100" y="66.8">6</text>
      <text x="100" y="74.8">7</text>
      <text x="100" y="82.8">8</text>
      <text x="100" y="157.2">3</text>
      <text x="100" y="149.2">4</text>
      <text x="100" y="141.2">5</text>
      <text x="100" y="133.2">6</text>
      <text x="100" y="125.2">7</text>
      <text x="100" y="117.2">8</text>
      <text x="42.8" y="100">3</text>
      <text x="50.8" y="100">4</text>
      <text x="58.8" y="100">5</text>
      <text x="66.8" y="100">6</text>
      <text x="74.8" y="100">7</text>
      <text x="82.8" y="100">8</text>
      <text x="157.2" y="100">3</text>
      <text x="149.2" y="100">4</text>
      <text x="141.2" y="100">5</text>
      <text x="133.2" y="100">6</text>
      <text x="125.2" y="100">7</text>
      <text x="117.2" y="100">8</text>
    </g>
  </g>
</svg>
