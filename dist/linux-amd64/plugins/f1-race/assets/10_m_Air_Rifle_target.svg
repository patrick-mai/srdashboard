<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    Original face artwork (outer ring r=90 in local coords), uniformly scaled so
    that ring maps to ISSF Ø 45.5 mm (r=22.75) in the 200 mm DISAG frame.
    scale = 22.75/90 ≈ 0.252778 about centre (100,100).
  -->
  <desc>ISSF 10m air rifle (45.5 mm) — scaled original face with ring numbers</desc>
  <g transform="translate(100,100) scale(0.2527777778) translate(-100,-100)">
    <g stroke-width="0.5">
      <g fill="white" stroke="black">
        <circle r="90" cx="100" cy="100"/>
        <circle r="80" cx="100" cy="100"/>
        <circle r="70" cx="100" cy="100"/>
      </g>
      <g fill="black" stroke="white">
        <circle r="60" cx="100" cy="100"/>
        <circle r="50" cx="100" cy="100"/>
        <circle r="40" cx="100" cy="100"/>
        <circle r="30" cx="100" cy="100"/>
        <circle r="20" cx="100" cy="100"/>
        <circle r="10" cx="100" cy="100"/>
      </g>
      <circle r="1" cx="100" cy="100" fill="white" stroke="white"/>
    </g>
    <g font-size="7" font-family="arial" text-anchor="middle" fill="black">
      <text x="100" y="18">1</text>
      <text x="100" y="28">2</text>
      <text x="100" y="38">3</text>
      <text x="100" y="167">3</text>
      <text x="100" y="177">2</text>
      <text x="100" y="187">1</text>
      <text x="15" y="103">1</text>
      <text x="25" y="103">2</text>
      <text x="35" y="103">3</text>
      <text x="165" y="103">3</text>
      <text x="175" y="103">2</text>
      <text x="185" y="103">1</text>
      <g fill="white">
        <text x="100" y="48">4</text>
        <text x="100" y="58">5</text>
        <text x="100" y="68">6</text>
        <text x="100" y="78">7</text>
        <text x="100" y="88">8</text>
        <text x="100" y="117">8</text>
        <text x="100" y="127">7</text>
        <text x="100" y="137">6</text>
        <text x="100" y="147">5</text>
        <text x="100" y="157">4</text>
        <text x="45" y="103">4</text>
        <text x="55" y="103">5</text>
        <text x="65" y="103">6</text>
        <text x="75" y="103">7</text>
        <text x="85" y="103">8</text>
        <text x="115" y="103">8</text>
        <text x="125" y="103">7</text>
        <text x="135" y="103">6</text>
        <text x="145" y="103">5</text>
        <text x="155" y="103">4</text>
      </g>
    </g>
  </g>
</svg>
