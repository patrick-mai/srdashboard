<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40 -18 80 36" class="f1-car-sprite">
  <!-- Detailed top-down F1 car; fill via currentColor on .f1-car-paint -->
  <defs>
    <linearGradient id="cockpit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0a0c"/>
      <stop offset="50%" stop-color="#1a1a22"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="0" cy="4" rx="28" ry="6" fill="#000" opacity="0.35"/>
  <!-- Rear wing -->
  <rect class="f1-car-paint" x="-30" y="-10" width="6" height="20" rx="1"/>
  <rect class="f1-car-paint" x="-32" y="-12" width="10" height="3" rx="0.5"/>
  <rect class="f1-car-paint" x="-32" y="9" width="10" height="3" rx="0.5"/>
  <!-- Rear tires -->
  <rect x="-22" y="-14" width="10" height="5" rx="1" fill="#111"/>
  <rect x="-22" y="9" width="10" height="5" rx="1" fill="#111"/>
  <!-- Sidepods / body -->
  <path class="f1-car-paint" d="M-24,-7 L8,-8 L14,-4 L14,4 L8,8 L-24,7 Z"/>
  <!-- Halo / cockpit -->
  <ellipse cx="-2" cy="0" rx="7" ry="4.5" fill="url(#cockpit)"/>
  <ellipse cx="-1" cy="0" rx="4" ry="2.5" fill="#3af" opacity="0.35"/>
  <!-- Nose -->
  <path class="f1-car-paint" d="M12,-3.5 L32,0 L12,3.5 Z"/>
  <!-- Front wing -->
  <rect class="f1-car-paint" x="28" y="-11" width="5" height="22" rx="1"/>
  <rect class="f1-car-paint" x="30" y="-13" width="8" height="2.5" rx="0.5"/>
  <rect class="f1-car-paint" x="30" y="10.5" width="8" height="2.5" rx="0.5"/>
  <!-- Front tires -->
  <rect x="18" y="-13" width="9" height="4.5" rx="1" fill="#111"/>
  <rect x="18" y="8.5" width="9" height="4.5" rx="1" fill="#111"/>
  <!-- Highlight stripe -->
  <path d="M-20,-1.5 L10,-1.5 L12,0 L10,1.5 L-20,1.5 Z" fill="#fff" opacity="0.2"/>
  <!-- Number plate -->
  <circle cx="4" cy="0" r="5" fill="#fff" opacity="0.92"/>
</svg>
